# Origin the browser uses to reach Home Assistant: taken from the Referer the
# web vault sends, with the headers set by Home Assistant as the fallback.
map $http_referer $ingress_origin {
    default                         $http_x_forwarded_proto://$http_x_forwarded_host;
    "~^(?<origin>https?://[^/]+)"   $origin;
}

server {
    listen 8099 default_server;
    listen [::]:8099 default_server;

    include /etc/nginx/includes/server_params.conf;
    include /etc/nginx/includes/proxy_params.conf;

    # Ingress traffic always comes from the Supervisor.
    allow   172.30.32.2;
    deny    all;

    location / {
        proxy_pass http://backend;

        # Setting a header here drops the ones inherited from
        # proxy_params.conf, hence the full list.
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header X-Real-IP $remote_addr;

        # Without a configured domain, Vaultwarden builds attachment and Send
        # download links from the Referer. Hand it the Ingress base URL.
        proxy_set_header Referer $ingress_origin$http_x_ingress_path;

        # Vaultwarden is not aware of the Ingress path: prefix its redirects,
        # cookie paths and the absolute links of the admin and error pages.
        # Redirects stay relative, as this host and port mean nothing to the
        # browser.
        absolute_redirect off;
        proxy_redirect / $http_x_ingress_path/;
        proxy_cookie_path / $http_x_ingress_path/;

        sub_filter_once off;
        sub_filter 'href="/' 'href="$http_x_ingress_path/';
        sub_filter 'src="/' 'src="$http_x_ingress_path/';
        sub_filter 'action="/' 'action="$http_x_ingress_path/';
    }
}
